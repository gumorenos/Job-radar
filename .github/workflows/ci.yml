name: CI

on:
  push:
    branches:
      - main
      - feat/phase-2-core-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: job_radar
          POSTGRES_USER: job_radar
          POSTGRES_PASSWORD: job_radar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_radar -d job_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JOB_RADAR_APP_ENV: test
      JOB_RADAR_DATABASE_URL: postgresql+psycopg://job_radar:job_radar_ci@127.0.0.1:5432/job_radar
      JOB_RADAR_API_KEY: ci-only-test-key
      JOB_RADAR_STORAGE_PATH: /tmp/job-radar-ci-storage

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync locked environment
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run --locked ruff check .

      - name: Mypy
        run: uv run --locked mypy app tests

      - name: Deployment shell syntax
        run: >-
          bash -n
          ops/preflight.sh
          ops/deploy.sh
          ops/backup.sh
          ops/smoke.sh
          ops/install_openclaw_bridge.sh
          ops/uninstall_openclaw_bridge.sh

      - name: OpenClaw bridge syntax
        run: uv run --locked python -m py_compile ops/openclaw_job_radar_sync.py

      - name: Production Compose config
        run: docker compose --env-file .env.production.example config >/dev/null

      - name: Docker image build
        run: docker build -t job-radar:ci .

      - name: Unit tests
        run: uv run --locked pytest -q tests/unit

      - name: Alembic upgrade
        run: uv run --locked alembic upgrade head

      - name: Integration tests
        run: uv run --locked pytest -q tests/integration
